name: Chappie learning tests

on:
  push:
    branches:
      - main
      - v23-causalite-gemini-live
      - feat/chappie-v29-v33-unified-evolution
  pull_request:
    branches:
      - main

jobs:
  learning-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Test learning and shared cognitive brain
        run: python -m pytest backend/tests/test_language.py backend/tests/test_sensory.py backend/tests/test_object_learning.py backend/tests/test_causal_learning.py backend/tests/test_supervised_learning.py backend/tests/test_shared_brain.py backend/tests/test_spatial_memory.py -q
