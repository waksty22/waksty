name: Chappie learning tests

on:
  push:
    branches:
      - main
      - v23-causalite-gemini-live
      - feat/chappie-v29-v33-unified-evolution
      - feature/v36-3-turso-compatibility
      - feature/v36-4-libsql-integration-clean
      - feature/v36-5-episodic-memory-libsql-clean
      - feature/chappie-v50-integrated-build
      - feature/chappie-v50-4-autobiographical-recall
      - feature/chappie-v50-5-experience-connections
      - feature/chappie-v50-6-learning-from-errors
      - feature/chappie-v50-7-correction-guided-reasoning
      - feature/chappie-v50-8-supervised-learning-agenda
      - feature/chappie-v50-9-learning-center
      - feature/chappie-v50-10-learning-goals
      - feature/chappie-v50-11-goal-skill-linking
      - feature/chappie-v50-12-knowledge-acquisition
      - feature/chappie-v50-13-knowledge-dashboard
      - feature/chappie-v50-14-contextual-knowledge-recall
  pull_request:
    branches:
      - main

jobs:
  learning-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest libsql
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check browser JavaScript syntax
        run: |
          cp backend/static/js/app.js /tmp/chappie-app.mjs
          cp backend/static/js/audio.js /tmp/chappie-audio.mjs
          cp backend/static/js/websocket.js /tmp/chappie-websocket.mjs
          node --check /tmp/chappie-app.mjs
          node --check /tmp/chappie-audio.mjs
          node --check /tmp/chappie-websocket.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("backend/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          Path("/tmp/chappie-inline.mjs").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/chappie-inline.mjs
      - name: Test storage adapter, learning and shared cognitive brain
        run: python -m pytest backend/tests/test_libsql_adapter.py backend/tests/test_v50_storage_factory.py backend/tests/test_v50_core_memory_integration.py backend/tests/test_v50_all_subsystems_schema.py backend/tests/test_v50_learning_pipeline_integration.py backend/tests/test_v50_causal_and_multimodal_integration.py backend/tests/test_v50_cognition_curriculum_integration.py backend/tests/test_v50_backup_restore_rollback.py backend/tests/test_v50_schema_migration_dry_run.py backend/tests/test_language.py backend/tests/test_sensory.py backend/tests/test_object_learning.py backend/tests/test_causal_learning.py backend/tests/test_supervised_learning.py backend/tests/test_shared_brain.py backend/tests/test_spatial_memory.py backend/tests/test_skill_evidence.py backend/tests/test_memory_integration.py backend/tests/test_v50_4_autobiographical_recall.py backend/tests/test_v50_5_experience_connections.py backend/tests/test_v50_6_learning_from_errors.py backend/tests/test_v50_7_correction_guided_reasoning.py backend/tests/test_v50_8_supervised_learning_agenda.py backend/tests/test_v50_9_learning_center.py backend/tests/test_v50_10_personal_learning_goals.py backend/tests/test_v50_11_goal_skill_linking.py backend/tests/test_v50_12_knowledge_acquisition.py backend/tests/test_v50_13_knowledge_dashboard.py backend/tests/test_v50_14_contextual_knowledge_recall.py backend/tests/test_live_tickets.py -q
