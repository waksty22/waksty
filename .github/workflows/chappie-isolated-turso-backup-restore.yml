name: Chappie isolated Turso backup and restore E2E

on:
  workflow_dispatch:
  # Run an additional recovery drill whenever the encrypted daily backup succeeds.
  workflow_run:
    workflows:
      - Chappie Turso encrypted backup
    types:
      - completed
  # Weekly isolated restore drill; never targets the production database.
  schedule:
    - cron: "23 4 * * 0"

concurrency:
  group: chappie-isolated-turso-backup-restore
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  daily-artifact-recovery:
    name: restore-real-daily-artifact-into-local-sqlite
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out guarded recovery implementation
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download the exact encrypted artifact from the completed backup run
        uses: actions/download-artifact@v8
        with:
          name: chappie-turso-backup-${{ github.event.workflow_run.id }}
          path: daily-backup-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install recovery dependencies
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Authenticate, restore, and verify in disposable in-memory SQLite
        run: python backend/scripts/test_daily_encrypted_backup_recovery.py --artifact-dir daily-backup-artifact
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}

  isolated-turso-backup-restore:
    name: encrypted-backup-restore-on-isolated-db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAPPIE_TEST_TURSO_DATABASE_URL: ${{ secrets.CHAPPIE_TEST_TURSO_DATABASE_URL }}
      CHAPPIE_TEST_TURSO_AUTH_TOKEN: ${{ secrets.CHAPPIE_TEST_TURSO_AUTH_TOKEN }}
      # Read only for hostname comparison; the production DB is never connected to.
      CHAPPIE_PRODUCTION_TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
    steps:
      - name: Checkout guarded restore implementation
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install isolated E2E dependencies
        run: python -m pip install --disable-pip-version-check libsql httpx cryptography

      - name: Validate required isolated test configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHAPPIE_TEST_TURSO_DATABASE_URL"
          test -n "$CHAPPIE_TEST_TURSO_AUTH_TOKEN"
          test -n "$CHAPPIE_PRODUCTION_TURSO_DATABASE_URL"
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          expected = "chappie-test-isolated-chapoue.aws-eu-west-1.turso.io"
          test_url = urlparse(os.environ["CHAPPIE_TEST_TURSO_DATABASE_URL"])
          prod_url = urlparse(os.environ["CHAPPIE_PRODUCTION_TURSO_DATABASE_URL"])
          if test_url.scheme != "libsql" or test_url.hostname != expected:
              raise SystemExit("Refusing: isolated test target hostname mismatch.")
          if not prod_url.hostname or prod_url.hostname == test_url.hostname:
              raise SystemExit("Refusing: production and test database identities are not distinct.")
          print("Target identity checks passed; production URL is used only for comparison.")
          PY

      - name: Run encrypted backup, empty-target restore, and cleanup test
        working-directory: backend
        run: python scripts/test_turso_backup_restore_e2e.py
