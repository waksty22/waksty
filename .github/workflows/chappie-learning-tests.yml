name: Chappie learning tests

on:
  push:
    branches:
      - main
      - v23-causalite-gemini-live
      - feat/chappie-v29-v33-unified-evolution
      - feature/v36-3-turso-compatibility
      - feature/v36-4-libsql-integration-tests
      - feature/v36-5-episodic-memory-libsql
      - feature/v36-6-spatial-memory-libsql
      - feature/v36-7-autobiographical-memory-libsql
      - feature/v36-8-shared-brain-autobiographical-libsql
  pull_request:
    branches:
      - main

jobs:
  learning-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest libsql
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check browser JavaScript syntax
        run: |
          cp backend/static/js/app.js /tmp/chappie-app.mjs
          cp backend/static/js/audio.js /tmp/chappie-audio.mjs
          cp backend/static/js/websocket.js /tmp/chappie-websocket.mjs
          node --check /tmp/chappie-app.mjs
          node --check /tmp/chappie-audio.mjs
          node --check /tmp/chappie-websocket.mjs
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("backend/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          Path("/tmp/chappie-inline.mjs").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/chappie-inline.mjs
      - name: Test storage adapter, learning and shared cognitive brain
        run: python -m pytest backend/tests/test_libsql_adapter.py backend/tests/test_libsql_spatial_memory.py backend/tests/test_libsql_autobiographical_memory.py backend/tests/test_libsql_shared_brain_autobiographical.py backend/tests/test_language.py backend/tests/test_sensory.py backend/tests/test_object_learning.py backend/tests/test_causal_learning.py backend/tests/test_supervised_learning.py backend/tests/test_shared_brain.py backend/tests/test_spatial_memory.py backend/tests/test_skill_evidence.py backend/tests/test_memory_integration.py backend/tests/test_live_tickets.py -q
