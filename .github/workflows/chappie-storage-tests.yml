name: Chappie storage safety tests

on:
  push:
    branches: [main]
    paths:
      - "backend/server.py"
      - "backend/storage/**"
      - "backend/scripts/backup_turso.py"
      - "backend/tests/test_server_storage_selection.py"
      - "backend/tests/test_turso_existing_schema_adoption.py"
      - "backend/tests/test_turso_backup_job.py"
      - "backend/tests/test_data_migration.py"
      - "backend/tests/test_v50_1_logical_backup.py"
      - "backend/tests/test_chappie_schema_logical_backup_restore.py"
      - "backend/tests/test_hrana_backup_adapter.py"
      - "backend/tests/test_hrana_http_backup.py"
      - "backend/tests/test_logical_backup_transactions.py"
      - "backend/tests/test_migration_audit.py"
      - "backend/tests/test_skill_schema_compat.py"
      - "backend/tests/test_storage_connection_factory.py"
      - "backend/tests/test_turso_compat.py"
      - "backend/tests/test_v50_1_preserve_existing_turso_rows.py"
      - "backend/tests/test_v50_1_schema_migration.py"
      - "backend/tests/test_v50_62_migration_diagnostics.py"
      - "backend/tests/test_v50_backup_restore_rollback.py"
      - "backend/tests/test_v50_schema_migration_dry_run.py"
      - "backend/tests/test_v50_storage_factory.py"
      - "backend/requirements.txt"
      - ".github/workflows/chappie-storage-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/server.py"
      - "backend/storage/**"
      - "backend/scripts/backup_turso.py"
      - "backend/tests/test_server_storage_selection.py"
      - "backend/tests/test_turso_existing_schema_adoption.py"
      - "backend/tests/test_turso_backup_job.py"
      - "backend/tests/test_data_migration.py"
      - "backend/tests/test_v50_1_logical_backup.py"
      - "backend/tests/test_chappie_schema_logical_backup_restore.py"
      - "backend/tests/test_hrana_backup_adapter.py"
      - "backend/tests/test_hrana_http_backup.py"
      - "backend/tests/test_logical_backup_transactions.py"
      - "backend/tests/test_migration_audit.py"
      - "backend/tests/test_skill_schema_compat.py"
      - "backend/tests/test_storage_connection_factory.py"
      - "backend/tests/test_turso_compat.py"
      - "backend/tests/test_v50_1_preserve_existing_turso_rows.py"
      - "backend/tests/test_v50_1_schema_migration.py"
      - "backend/tests/test_v50_62_migration_diagnostics.py"
      - "backend/tests/test_v50_backup_restore_rollback.py"
      - "backend/tests/test_v50_schema_migration_dry_run.py"
      - "backend/tests/test_v50_storage_factory.py"
      - "backend/requirements.txt"
      - ".github/workflows/chappie-storage-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install --disable-pip-version-check torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run storage migration, bootstrap, reset and backup tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_server_storage_selection.py \
            tests/test_turso_existing_schema_adoption.py \
            tests/test_data_migration.py \
            tests/test_turso_backup_job.py \
            tests/test_v50_1_logical_backup.py \
            tests/test_chappie_schema_logical_backup_restore.py \
            tests/test_hrana_backup_adapter.py \
            tests/test_hrana_http_backup.py \
            tests/test_logical_backup_transactions.py \
            tests/test_migration_audit.py \
            tests/test_skill_schema_compat.py \
            tests/test_storage_connection_factory.py \
            tests/test_turso_compat.py \
            tests/test_v50_1_preserve_existing_turso_rows.py \
            tests/test_v50_1_schema_migration.py \
            tests/test_v50_62_migration_diagnostics.py \
            tests/test_v50_backup_restore_rollback.py \
            tests/test_v50_schema_migration_dry_run.py \
            tests/test_v50_storage_factory.py
