name: Chappie learning tests

on:
  push:
    branches:
      - audit/chappie-v28
  pull_request:
    branches:
      - main

jobs:
  learning-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Test vocabulary and sensory learning
        run: python -m pytest backend/tests/test_language.py backend/tests/test_sensory.py -q
