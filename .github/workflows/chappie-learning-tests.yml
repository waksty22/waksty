name: Chappie quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pytest libsql cryptography fastapi uvicorn python-dotenv pydantic httpx "websockets>=12,<16" google-genai edge-tts

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Check browser JavaScript syntax
        run: |
          for file in app audio websocket api; do
            cp "backend/static/js/$file.js" "/tmp/chappie-$file.mjs"
            node --check "/tmp/chappie-$file.mjs"
          done
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("backend/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          Path("/tmp/chappie-inline.mjs").write_text("\n".join(scripts), encoding="utf-8")

          modules = re.findall(r'<script type="module">(.*?)</script>', html, flags=re.S)
          for index, script in enumerate(modules):
              Path(f"/tmp/chappie-module-{index}.mjs").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/chappie-inline.mjs
          for module in /tmp/chappie-module-*.mjs; do
            node --check "$module"
          done

      - name: Test complete backend test suite
        run: python -m pytest backend/tests -q
